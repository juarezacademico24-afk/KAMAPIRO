<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAMAPIRO · Compras</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#222}header{background:#111827;color:#fff;text-align:center;padding:18px}header h1{margin:0}header p{margin:5px 0}.container{max-width:980px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px #0001}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.field{margin:12px 0}.field label{display:block;font-weight:bold;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;font-size:16px}.field textarea{min-height:80px}.btn{border:0;border-radius:9px;padding:10px 13px;margin:3px;cursor:pointer}.primary{background:#111827;color:#fff}.success{background:#16a34a;color:#fff}.danger{background:#dc2626;color:#fff}.warning{background:#f59e0b;color:#fff}.secondary{background:#e5e7eb;color:#222}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.metric{border:1px solid #e5e7eb;border-radius:10px;padding:14px}.metric small{display:block;color:#666}.metric strong{font-size:22px}.row{display:flex;gap:12px;align-items:center;border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:10px 0}.grow{flex:1}.actions{display:flex;flex-direction:column}.muted{color:#666;font-size:13px}.calc{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:12px}.alert{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:12px}.good{background:#f0fdf4;border-color:#bbf7d0}@media(max-width:600px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}.row{align-items:flex-start}.actions{flex-direction:row;flex-wrap:wrap}}</style></head><body><header><h1>🛍️ KAMAPIRO</h1><p>Compras e ingreso de inventario</p></header><div class="container"><div class="top"><h2>🛒 Registrar compra</h2><button class="btn secondary" onclick="location.href='index.html'">← KAMAPIRO</button></div><div class="card"><div class="field"><label>Fecha</label><input type="date" id="fecha"></div><div class="field"><label>Proveedor</label><input id="proveedor" placeholder="Ej. Repuestos del Norte"></div><div class="field"><label>Producto</label><select id="producto" onchange="actualizar()"><option value="">Seleccione un producto</option></select></div><div class="grid"><div class="field"><label>Cantidad</label><input type="number" id="cantidad" min="1" value="1" oninput="actualizar()"></div><div class="field"><label>Costo unitario (L.)</label><input type="number" id="costo" min="0" step="0.01" oninput="actualizar()"></div></div><div class="field"><label>Forma de pago</label><select id="pago" onchange="actualizar()"><option value="contado">Contado</option><option value="credito">Crédito</option></select></div><div class="field"><label>Descripción / factura</label><textarea id="descripcion" placeholder="Ej. Factura 001-001-01-00012345"></textarea></div><div class="calc">Total de compra: <b id="total">L.0.00</b><br>Nuevo costo promedio: <b id="promedio">L.0.00</b></div><button class="btn success" onclick="guardar()">💾 Registrar compra</button></div><div class="card"><h3>📦 Inventario actual</h3><div class="grid"><div class="metric"><small>Productos</small><strong id="productos">0</strong></div><div class="metric"><small>Unidades</small><strong id="unidades">0</strong></div><div class="metric"><small>Valor al costo</small><strong id="valor">L.0.00</strong></div><div class="metric"><small>Compras registradas</small><strong id="ncompras">0</strong></div></div></div><div class="card"><h3>📋 Historial de compras</h3><div id="lista"></div></div></div><script>let P=JSON.parse(localStorage.getItem('kamapiro_productos')||'[]'),Q=JSON.parse(localStorage.getItem('kamapiro_compras')||'[]');const money=n=>'L.'+(Number(n)||0).toLocaleString('es-HN',{minimumFractionDigits:2,maximumFractionDigits:2});const same=(a,b)=>String(a)===String(b);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const today=()=>{let d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};function persist(){localStorage.setItem('kamapiro_productos',JSON.stringify(P));localStorage.setItem('kamapiro_compras',JSON.stringify(Q))}function cargar(){fecha.value=today();producto.innerHTML='<option value="">Seleccione un producto</option>'+P.map(p=>`<option value="${esc(p.id)}">${esc(p.nombre)} · Existencia: ${p.existencia||0}</option>`).join('');render();actualizar()}function actualizar(){let p=P.find(x=>same(x.id,producto.value)),q=+cantidad.value||0,c=+costo.value||0,total=q*c;totalEl=total;document.getElementById('total').textContent=money(total);let prom=p&&q>0?(Number(p.costo||0)*Number(p.existencia||0)+total)/(Number(p.existencia||0)+q):c;document.getElementById('promedio').textContent=money(prom)}function guardar(){let p=P.find(x=>same(x.id,producto.value)),q=+cantidad.value||0,c=+costo.value||0;if(!p)return alert('Seleccioná un producto.');if(q<1)return alert('La cantidad debe ser mayor que cero.');if(c<=0)return alert('Ingresá un costo unitario válido.');let stock=Number(p.existencia||0),valorAnterior=Number(p.costo||0)*stock,total=q*c,nuevoProm=(valorAnterior+total)/(stock+q);p.existencia=stock+q;p.costo=nuevoProm;p.utilidad=Number(p.precio||0)-nuevoProm;p.margen=p.precio?((Number(p.precio||0)-nuevoProm)/Number(p.precio||0))*100:0;let obj={id:String(Date.now()),fecha:fecha.value||today(),proveedor:proveedor.value.trim()||'Sin proveedor',productoId:p.id,producto:p.nombre,cantidad:q,costoUnitario:c,total,formaPago:pago.value,saldoPendiente:pago.value==='credito'?total:0,descripcion:descripcion.value.trim()};Q.unshift(obj);persist();alert('✅ Compra registrada. El inventario aumentó automáticamente.');proveedor.value='';cantidad.value=1;costo.value='';pago.value='contado';descripcion.value='';producto.value='';cargar()}function render(){productos.textContent=P.length;unidades.textContent=P.reduce((a,p)=>a+Number(p.existencia||0),0);valor.textContent=money(P.reduce((a,p)=>a+Number(p.costo||0)*Number(p.existencia||0),0));ncompras.textContent=Q.length;lista.innerHTML=Q.length?Q.map(x=>`<div class="row"><div class="grow"><b>🛒 ${esc(x.producto)} · ${money(x.total)}</b><div class="muted">${esc(x.fecha)} · Proveedor: ${esc(x.proveedor)}</div><div>${x.cantidad} unidades · Costo unitario: ${money(x.costoUnitario)} · ${x.formaPago==='credito'?'<b>CRÉDITO</b>':'Contado'}</div>${x.saldoPendiente?`<div>Saldo pendiente: <b>${money(x.saldoPendiente)}</b></div>`:''}${x.descripcion?`<div>${esc(x.descripcion)}</div>`:''}</div></div>`).join(''):'<p class="muted">Todavía no hay compras registradas.</p>'}cargar();</script></body></html>
