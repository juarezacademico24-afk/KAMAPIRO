<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAMAPIRO · Administración</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f4fa}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="app" src="./index.html" title="KAMAPIRO Administración"></iframe><script>document.getElementById('app').addEventListener('load',function(){setTimeout(function(){try{var f=document.getElementById('app'),w=f.contentWindow,b=f.contentDocument.querySelector('.gear');if(b)b.click();w.imageData=function(file){return new Promise(function(resolve,reject){if(!file)return resolve('');var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var max=500,w0=im.width,h0=im.height;if(w0>max||h0>max){if(w0>h0){h0=Math.round(h0*max/w0);w0=max}else{w0=Math.round(w0*max/h0);h0=max}}var c=document.createElement('canvas');c.width=w0;c.height=h0;c.getContext('2d').drawImage(im,0,0,w0,h0);try{resolve(c.toDataURL('image/jpeg',.5))}catch(e){reject(e)}};im.onerror=function(){reject(new Error('No se pudo leer la imagen'))};im.src=r.result};r.onerror=function(){reject(new Error('No se pudo leer el archivo'))};r.readAsDataURL(file)})}}catch(e){console.error(e)}},800)});</script></body></html>
