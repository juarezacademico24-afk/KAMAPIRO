<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAMAPIRO · Cuentas por pagar</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#222}header{background:#111827;color:#fff;text-align:center;padding:18px}header h1{margin:0}header p{margin:5px 0}.container{max-width:980px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px #0001}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{border:1px solid #e5e7eb;border-radius:10px;padding:14px}.metric small{display:block;color:#666}.metric strong{font-size:22px}.row{display:flex;gap:12px;align-items:center;border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:10px 0}.grow{flex:1}.btn{border:0;border-radius:9px;padding:10px 13px;margin:3px;cursor:pointer}.success{background:#16a34a;color:#fff}.secondary{background:#e5e7eb}.warning{background:#f59e0b;color:#fff}.muted{color:#666;font-size:13px}.alert{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:12px}.good{background:#f0fdf4;border-color:#bbf7d0}@media(max-width:600px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}.row{align-items:flex-start}} </style></head><body><header><h1>🛍️ KAMAPIRO</h1><p>Cuentas por pagar</p></header><div class="container"><div class="top"><h2>💳 Cuentas por pagar</h2><div><button class="btn secondary" onclick="location.href='compras.html'">← Compras</button><button class="btn secondary" onclick="location.href='index.html'">Inicio</button></div></div><div class="card"><h3>📊 Resumen de proveedores</h3><div class="grid"><div class="metric"><small>Facturas a crédito</small><strong id="facturas">0</strong></div><div class="metric"><small>Total pendiente</small><strong id="pendiente">L.0.00</strong></div><div class="metric"><small>Total pagado</small><strong id="pagado">L.0.00</strong></div></div></div><div class="card"><h3>📋 Pendientes</h3><div id="lista"></div></div><div class="card"><h3>📜 Historial de pagos</h3><div id="pagos"></div></div></div><script>let Q=JSON.parse(localStorage.getItem('kamapiro_compras')||'[]'),P=JSON.parse(localStorage.getItem('kamapiro_pagos')||'[]');const money=n=>'L.'+(Number(n)||0).toLocaleString('es-HN',{minimumFractionDigits:2,maximumFractionDigits:2});const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));function pagar(id){let q=Q.find(x=>x.id===id);if(!q)return;let saldo=Number(q.saldoPendiente||0);if(saldo<=0)return alert('Esta cuenta ya está pagada.');let v=prompt('Saldo pendiente: '+money(saldo)+'\nIngresá el monto del pago:',saldo.toFixed(2));if(v===null)return;let monto=Number(v);if(!Number.isFinite(monto)||monto<=0)return alert('Ingresá un monto válido.');if(monto>saldo)monto=saldo;let fecha=new Date();let f=new Date(fecha.getTime()-fecha.getTimezoneOffset()*60000).toISOString().slice(0,10);q.saldoPendiente=saldo-monto;if(q.saldoPendiente<0.005)q.saldoPendiente=0;P.unshift({id:String(Date.now()),compraId:q.id,fecha,monto,proveedor:q.proveedor,producto:q.producto});localStorage.setItem('kamapiro_compras',JSON.stringify(Q));localStorage.setItem('kamapiro_pagos',JSON.stringify(P));render()}function render(){let pendientes=Q.filter(x=>x.formaPago==='credito'&&Number(x.saldoPendiente||0)>0);let creditos=Q.filter(x=>x.formaPago==='credito');let total=pendientes.reduce((s,x)=>s+Number(x.saldoPendiente||0),0);let pagado=P.reduce((s,x)=>s+Number(x.monto||0),0);facturas.textContent=creditos.length;pendiente.textContent=money(total);document.getElementById('pagado').textContent=money(pagado);lista.innerHTML=pendientes.length?pendientes.map(x=>`<div class="row"><div class="grow"><b>💳 ${esc(x.proveedor)} · ${esc(x.producto)}</b><div class="muted">Factura: ${esc(x.descripcion||'Sin factura')} · Compra: ${esc(x.fecha)}</div><div>${x.cantidad} unidades · Total factura: <b>${money(x.total)}</b></div><div class="alert">Saldo pendiente: <b>${money(x.saldoPendiente)}</b></div></div><button class="btn success" onclick="pagar('${x.id}')">💵 Registrar pago</button></div>`).join(''):'<div class="alert good">✅ No hay cuentas por pagar pendientes.</div>';pagos.innerHTML=P.length?P.map(x=>`<div class="row"><div class="grow"><b>💵 ${money(x.monto)} · ${esc(x.proveedor)}</b><div class="muted">${esc(x.fecha)} · ${esc(x.producto)}</div></div></div>`).join(''):'<p class="muted">Todavía no hay pagos registrados.</p>'}render();</script></body></html>
