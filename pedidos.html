<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAMAPIRO · Pedidos pendientes</title><style>body{margin:0;font-family:Arial;background:#f7f4fa;color:#33283c}.top{background:#35144d;color:white;padding:18px}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:white;border:1px solid #e8ddeb;border-radius:16px;padding:16px;margin-bottom:14px}.muted{color:#7c7084;font-size:13px}.btn{border:0;border-radius:10px;padding:11px 14px;cursor:pointer;font-weight:700}.ok{background:#542078;color:white}.cancel{background:#f8e9e9;color:#9b2f2f;margin-left:8px}.empty{text-align:center;padding:35px;color:#7c7084}.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #eee;padding:8px 0}.total{font-weight:900;color:#542078;font-size:18px;margin-top:12px}</style></head><body><div class="top"><strong>✦ KAMAPIRO</strong><div style="margin-top:5px">🟡 Pedidos pendientes</div></div><div class="wrap"><div class="card"><h2 style="margin-top:0">Pedidos pendientes</h2><p class="muted">Un pedido recibido todavía no es una venta. Registra la venta solamente después de hablar con el cliente y confirmar la operación.</p><div id="list"></div></div></div><script>const orders=JSON.parse(localStorage.getItem('kamapiro_pending_orders')||'[]');const list=document.getElementById('list');function render(){if(!orders.length){list.innerHTML='<div class="empty">No hay pedidos pendientes.</div>';return}list.innerHTML=orders.map((o,i)=>`<div class="card"><h3 style="margin-top:0">Pedido #${String(i+1).padStart(3,'0')}</h3><div class="muted">Cliente: Pendiente de confirmar<br>Fecha: ${o.date||'—'}</div>${(o.items||[]).map(x=>`<div class="row"><span>${x.name} × ${x.qty}</span><strong>L. ${(Number(x.price)*Number(x.qty)).toFixed(2)}</strong></div>`).join('')}<div class="total">Total solicitado: L. ${Number(o.total||0).toFixed(2)}</div><div style="margin-top:14px"><button class="btn ok" onclick="register(${i})">🟢 Registrar venta</button><button class="btn cancel" onclick="cancelOrder(${i})">🔴 Cancelar pedido</button></div></div>`).join('')}function register(i){alert('Siguiente paso: abrir Registrar venta con este pedido cargado. Esta primera versión no modifica inventario ni contabilidad.')}function cancelOrder(i){if(confirm('¿Cancelar este pedido?')){orders.splice(i,1);localStorage.setItem('kamapiro_pending_orders',JSON.stringify(orders));render()}}render();</script></body></html>
