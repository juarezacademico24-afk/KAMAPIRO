<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAMAPIRO · Pedidos</title><style>body{margin:0;font-family:Arial;background:#f7f4fa;color:#33283c}.top{background:#35144d;color:white;padding:18px}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:white;border:1px solid #e8ddeb;border-radius:16px;padding:16px;margin-bottom:14px}.muted{color:#7c7084;font-size:13px}.btn{border:0;border-radius:10px;padding:11px 14px;cursor:pointer;font-weight:700}.ok{background:#542078;color:white}.cancel{background:#f8e9e9;color:#9b2f2f;margin-left:8px}.empty{text-align:center;padding:35px;color:#7c7084}.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #eee;padding:8px 0}.total{font-weight:900;color:#542078;font-size:18px;margin-top:12px}.success{background:#e5f6ed;color:#17653d;padding:14px;border-radius:12px;font-weight:700;margin-top:12px}.danger{background:#fff1f1;color:#9b2f2f;padding:12px;border-radius:12px;margin-top:12px}</style></head><body><div class="top"><strong>✦ KAMAPIRO</strong><div style="margin-top:5px">📋 Gestión de pedidos</div></div><div class="wrap"><div class="card"><h2 style="margin-top:0">Pedidos pendientes</h2><p class="muted">Un pedido recibido todavía no es una venta. Registrá la venta solamente después de hablar con el cliente y confirmar la operación.</p><div id="list"></div></div></div><script>const PKEY='kamapiro_pending_orders',SKEY='kamapiro_sold_orders',DKEY='kamapiro_v2';let orders=JSON.parse(localStorage.getItem(PKEY)||'[]');const list=document.getElementById('list');const money=n=>'L. '+(Number(n)||0).toLocaleString('es-HN',{minimumFractionDigits:2,maximumFractionDigits:2});function render(){if(!orders.length){list.innerHTML='<div class="empty">No hay pedidos pendientes.</div>';return}list.innerHTML=orders.map((o,i)=>`<div class="card"><h3 style="margin-top:0">Pedido #${String(i+1).padStart(3,'0')}</h3><div class="muted">Cliente: Pendiente de confirmar<br>Fecha: ${o.date||'—'}</div>${(o.items||[]).map(x=>`<div class="row"><span>${x.name} × ${x.qty}</span><strong>${money(Number(x.price)*Number(x.qty))}</strong></div>`).join('')}<div class="total">Total solicitado: ${money(o.total)}</div><div style="margin-top:14px"><button class="btn ok" onclick="register(${i})">🟢 PEDIDO VENDIDO</button><button class="btn cancel" onclick="cancelOrder(${i})">🔴 Cancelar pedido</button></div></div>`).join('')}function register(i){const o=orders[i];if(!o)return;let data;try{data=JSON.parse(localStorage.getItem(DKEY)||'null')}catch(e){data=null}if(!data||!data.products){alert('Abrí primero KAMAPIRO en este teléfono para cargar los datos de la tienda.');return}const items=[];for(const x of o.items||[]){const p=data.products.find(p=>p.id===x.id);if(!p){alert('No se encontró el producto: '+x.name);return}if(Number(p.stock)<Number(x.qty)){alert('Existencia insuficiente para: '+x.name+' (disponible '+p.stock+')');return}items.push({id:p.id,qty:Number(x.qty),price:Number(p.price),cost:Number(p.cost),name:p.name})}items.forEach(x=>{const p=data.products.find(p=>p.id===x.id);p.stock-=x.qty});const total=items.reduce((a,x)=>a+x.price*x.qty,0),gain=items.reduce((a,x)=>a+(x.price-x.cost)*x.qty,0);data.sales=data.sales||[];if(data.sales.some(s=>s.id===o.id)){orders.splice(i,1);localStorage.setItem(PKEY,JSON.stringify(orders));render();return}data.sales.push({id:o.id,date:new Date().toISOString(),items,total,gain});localStorage.setItem(DKEY,JSON.stringify(data));const sold=JSON.parse(localStorage.getItem(SKEY)||'[]');sold.push({id:o.id,date:new Date().toISOString(),total,gain});localStorage.setItem(SKEY,JSON.stringify(sold));orders.splice(i,1);localStorage.setItem(PKEY,JSON.stringify(orders));render();alert('✅ Pedido vendido.\nVenta: '+money(total)+'\nGanancia: '+money(gain)+'\nInventario actualizado.')}function cancelOrder(i){if(!confirm('¿Cancelar este pedido? No se modificará inventario ni contabilidad.'))return;orders.splice(i,1);localStorage.setItem(PKEY,JSON.stringify(orders));render()}render();</script></body></html>
