<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAMAPIRO · Pedido</title><style>:root{--p:#542078;--p3:#35144d;--g:#d6b23f;--bg:#f7f4fa;--l:#e8ddeb;--m:#7c7084}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial;color:#33283c}.top{background:linear-gradient(135deg,var(--p),var(--p3));color:#fff;padding:18px}.wrap{max-width:680px;margin:auto;padding:18px}.card{background:#fff;border:1px solid var(--l);border-radius:16px;padding:18px;margin-bottom:14px}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--l)}.muted{color:var(--m);font-size:13px}.total{font-size:22px;font-weight:900;color:var(--p);text-align:right;margin:16px 0}.btn{width:100%;border:0;border-radius:12px;padding:13px;font-weight:800;cursor:pointer;margin-top:8px}.ok{background:var(--p);color:#fff}.cancel{background:#f8e9e9;color:#9b2f2f}.success{background:#e5f6ed;color:#17653d;padding:14px;border-radius:12px;font-weight:700}</style></head><body><div class="top"><b>✦ KAMAPIRO</b><div style="margin-top:5px">Pedido recibido</div></div><div class="wrap"><div id="app" class="card"></div></div><script>const money=n=>'L. '+(Number(n)||0).toLocaleString('es-HN',{minimumFractionDigits:2,maximumFractionDigits:2});const app=document.getElementById('app');let order;try{const raw=new URLSearchParams(location.search).get('pedido');order=JSON.parse(raw||'null')}catch(e){order=null}if(!order||!order.items?.length){app.innerHTML='<h2>Pedido no válido</h2><p class="muted">El enlace del pedido está incompleto o vencido.</p>';throw new Error('pedido invalido')}const PKEY='kamapiro_pending_orders';let pending=JSON.parse(localStorage.getItem(PKEY)||'[]');if(!pending.some(x=>x.id===order.id)){pending.push(order);localStorage.setItem(PKEY,JSON.stringify(pending))}function render(){app.innerHTML=`<h2>🟡 Pedido pendiente</h2><p class="muted">Pedido: ${order.id}<br>Recibido: ${new Date(order.date).toLocaleString('es-HN')}</p>${order.items.map(x=>`<div class="row"><span>${x.name} × ${x.qty}</span><b>${money(x.price*x.qty)}</b></div>`).join('')}<div class="total">Total solicitado: ${money(order.total)}</div><div class="muted">Primero hablá con el cliente. Si confirma la compra, registrá la venta. Si no confirma, cancelá el pedido.</div><button class="btn ok" onclick="registerSale()">🟢 Registrar venta confirmada</button><button class="btn cancel" onclick="cancelOrder()">🔴 Cancelar pedido</button><button class="btn" style="background:#f1e8f6;color:var(--p)" onclick="location.href='index.html'">↩ Volver a KAMAPIRO</button>`}function removePending(){pending=JSON.parse(localStorage.getItem(PKEY)||'[]').filter(x=>x.id!==order.id);localStorage.setItem(PKEY,JSON.stringify(pending))}function registerSale(){let data;try{data=JSON.parse(localStorage.getItem('kamapiro_v2')||'null')}catch(e){data=null}if(!data||!data.products){app.innerHTML='<div class="success">Abrí primero KAMAPIRO en este teléfono para cargar los datos de la tienda y luego volvé a abrir este pedido.</div>';return}const items=[];for(const x of order.items){const p=data.products.find(p=>p.id===x.id);if(!p){alert('No se encontró el producto: '+x.name);return}if(p.stock<x.qty){alert('Existencia insuficiente para: '+x.name+' (disponible '+p.stock+')');return}items.push({id:p.id,qty:x.qty,price:p.price,cost:p.cost,name:p.name})}items.forEach(x=>{const p=data.products.find(p=>p.id===x.id);p.stock-=x.qty});const total=items.reduce((a,x)=>a+x.price*x.qty,0),gain=items.reduce((a,x)=>a+(x.price-x.cost)*x.qty,0);data.sales=data.sales||[];data.sales.push({id:order.id,date:new Date().toISOString(),items,total,gain});localStorage.setItem('kamapiro_v2',JSON.stringify(data));removePending();app.innerHTML='<div class="success">✅ Venta registrada correctamente.<br><br>Se actualizó el inventario y la venta quedó registrada en KAMAPIRO.</div><button class="btn ok" onclick="location.href=\'index.html\'">Volver a KAMAPIRO</button>'}function cancelOrder(){if(!confirm('¿Cancelar este pedido?'))return;removePending();app.innerHTML='<div class="success">Pedido cancelado. No se modificó inventario ni contabilidad.</div><button class="btn ok" onclick="location.href=\'index.html\'">Volver a KAMAPIRO</button>'}render();</script></body></html>
