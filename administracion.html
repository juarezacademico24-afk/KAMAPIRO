<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAMAPIRO · Mi administración</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f4fa}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="kamapiro" src="index.html" title="KAMAPIRO"></iframe>
<script>
const frame=document.getElementById('kamapiro');
frame.addEventListener('load',()=>{
  try{
    const gear=frame.contentDocument.querySelector('.gear');
    if(gear) gear.click();
  }catch(e){console.error('KAMAPIRO:',e)}
});
</script>
</body>
</html>
