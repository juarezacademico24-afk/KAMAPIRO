<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAMAPIRO · Administración</title><script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script><script src="firebase-config.js?v=20260823-2301"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#111827}.top{background:#111827;color:#fff;padding:18px;text-align:center}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px #0001}.field{margin:11px 0}.field label{display:block;font-weight:bold;margin-bottom:5px}.field input,.field textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;font-size:16px}.field textarea{min-height:75px}.btn{border:0;border-radius:9px;padding:11px 14px;cursor:pointer;font-weight:700}.primary{background:#111827;color:#fff}.success{background:#16a34a;color:#fff}.danger{background:#dc2626;color:#fff}.secondary{background:#e5e7eb}.row{display:flex;gap:12px;align-items:center;border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:10px 0}.row img{width:64px;height:64px;object-fit:cover;border-radius:8px}.grow{flex:1}.muted{color:#6b7280;font-size:13px}.hidden{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.notice{padding:10px;border-radius:9px;margin:10px 0;background:#eef2ff}.login{text-align:center;padding:35px 20px}.login button{font-size:16px;width:100%}</style></head><body><header class="top"><h1>🛍️ KAMAPIRO</h1><div>Administración de tienda</div></header><main class="wrap"><section id="login" class="card login"><h2>🔐 Acceso de administración</h2><p>Ingresá con el correo y contraseña autorizados.</p><div class="field"><label>Correo electrónico</label><input id="loginEmail" type="email" autocomplete="username" placeholder="correo@ejemplo.com"></div><div class="field"><label>Contraseña</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Tu contraseña"></div><button id="loginBtn" class="btn primary">Ingresar</button><div id="loginNotice" class="notice hidden"></div></section><section id="app" class="hidden"><div class="card"><div class="topline"><div><b id="userName"></b><div id="userEmail" class="muted"></div></div><button id="logoutBtn" class="btn secondary">Salir</button></div></div><div id="notice" class="notice hidden"></div><div class="card"><h2 id="formTitle">➕ Agregar producto</h2><div class="field"><label>Fotografía</label><input type="file" id="image" accept="image/*"><div class="muted">La foto se reduce automáticamente.</div></div><div class="field"><label>Código</label><input id="code" placeholder="Ej. PRO-001"></div><div class="field"><label>Nombre</label><input id="name" placeholder="Ej. Producto nuevo"></div><div class="field"><label>Descripción</label><textarea id="description"></textarea></div><div class="field"><label>Categoría</label><input id="category" placeholder="Ej. Accesorios"></div><div class="field"><label>Costo (L.)</label><input id="cost" type="number" step="0.01"></div><div class="field"><label>Precio de venta (L.)</label><input id="price" type="number" step="0.01"></div><div class="field"><label>Existencia</label><input id="stock" type="number" min="0"></div><div class="actions"><button id="saveBtn" class="btn success">💾 Guardar producto</button><button id="cancelBtn" class="btn secondary hidden">Cancelar</button></div></div><div class="card"><div class="topline"><h2>📦 Productos</h2><span id="count" class="muted"></span></div><input id="search" placeholder="🔎 Buscar..." style="width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;font-size:16px"><div id="list"></div></div></section></main><script>firebase.initializeApp(window.KAMAPIRO_FIREBASE_CONFIG);const auth=firebase.auth(),db=firebase.firestore();let products=[],editing=null,newImage='';const $=id=>document.getElementById(id);function msg(t){$('notice').textContent=t;$('notice').classList.remove('hidden');setTimeout(()=>$('notice').classList.add('hidden'),5000)}function loginMsg(t){$('loginNotice').textContent=t;$('loginNotice').classList.remove('hidden')}function money(n){return 'L.'+(Number(n)||0).toLocaleString('es-HN',{minimumFractionDigits:2})}function clearForm(){$('image').value='';$('code').value='';$('name').value='';$('description').value='';$('category').value='';$('cost').value='';$('price').value='';$('stock').value='';editing=null;newImage='';$('formTitle').textContent='➕ Agregar producto';$('saveBtn').textContent='💾 Guardar producto';$('cancelBtn').classList.add('hidden')}function resizeImage(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const max=900;let w=im.width,h=im.height;if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max}else{w=Math.round(w*max/h);h=max}}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);resolve(c.toDataURL('image/jpeg',.7))};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}$('image').onchange=async e=>{const f=e.target.files[0];if(f){try{newImage=await resizeImage(f)}catch(e){newImage='';msg('No se pudo procesar la foto.')}}};$('loginBtn').onclick=async()=>{const b=$('loginBtn'),email=$('loginEmail').value.trim(),password=$('loginPassword').value;b.disabled=true;b.textContent='Ingresando…';$('loginNotice').classList.add('hidden');try{await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);await auth.signInWithEmailAndPassword(email,password)}catch(e){console.error('KAMAPIRO LOGIN',e);loginMsg('NO SE PUDO INICIAR SESIÓN: '+(e.code||'sin código')+' — '+(e.message||'sin detalle'));b.disabled=false;b.textContent='Ingresar'}};$('loginPassword').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});$('saveBtn').onclick=async()=>{if(!auth.currentUser)return msg('Primero iniciá sesión.');if(!$('name').value.trim())return msg('Escribí el nombre del producto.');const id=editing||db.collection('productos').doc().id;const old=editing?products.find(p=>p.id===editing):null;const data={codigo:$('code').value.trim(),nombre:$('name').value.trim(),descripcion:$('description').value.trim(),categoria:$('category').value.trim(),costo:Number($('cost').value)||0,precio:Number($('price').value)||0,existencia:Number($('stock').value)||0,activo:true,imagen:newImage||(old&&old.imagen)||'',actualizado:firebase.firestore.FieldValue.serverTimestamp()};try{await db.collection('productos').doc(id).set(data,{merge:true});clearForm();msg('Producto guardado ✓')}catch(e){console.error(e);msg('ERROR AL GUARDAR: '+(e.code||'sin código')+' — '+(e.message||'sin detalle'))}};$('cancelBtn').onclick=clearForm;function escapeHtml(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}function render(){const q=$('search').value.toLowerCase();const a=products.filter(p=>(p.nombre+' '+p.codigo+' '+p.categoria).toLowerCase().includes(q));$('count').textContent=a.length+' productos';$('list').innerHTML=a.length?a.map(p=>`<div class="row">${p.imagen?`<img src="${p.imagen}">`:''}<div class="grow"><b>${escapeHtml(p.nombre)}</b><div class="muted">${escapeHtml(p.codigo||'Sin código')} · ${escapeHtml(p.categoria||'Sin categoría')}</div><div>${money(p.precio)} · Existencia: <b>${p.existencia||0}</b></div></div><div class="actions"><button class="btn secondary" onclick="editProduct('${p.id}')">Editar</button><button class="btn danger" onclick="removeProduct('${p.id}')">Borrar</button></div></div>`).join(''):'<p class="muted">No hay productos registrados.</p>'}window.editProduct=id=>{const p=products.find(x=>x.id===id);if(!p)return;editing=id;$('code').value=p.codigo||'';$('name').value=p.nombre||'';$('description').value=p.descripcion||'';$('category').value=p.categoria||'';$('cost').value=p.costo||'';$('price').value=p.precio||'';$('stock').value=p.existencia||'';newImage='';$('formTitle').textContent='✏️ Editar producto';$('saveBtn').textContent='Actualizar producto';$('cancelBtn').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})};window.removeProduct=async id=>{if(confirm('¿Borrar este producto?')){try{await db.collection('productos').doc(id).delete();msg('Producto borrado ✓')}catch(e){msg('ERROR AL BORRAR: '+(e.code||'sin código')+' — '+(e.message||'sin detalle'))}}};$('search').oninput=render;$('logoutBtn').onclick=()=>auth.signOut();auth.onAuthStateChanged(user=>{if(user){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('userName').textContent=user.displayName||'Administrador';$('userEmail').textContent=user.email||'';db.collection('productos').orderBy('actualizado','desc').onSnapshot(s=>{products=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>msg('ERROR AL LEER PRODUCTOS: '+(e.code||'sin código')+' — '+(e.message||'sin detalle')))}else{$('login').classList.remove('hidden');$('app').classList.add('hidden')}});</script></body></html>
