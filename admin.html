<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAMAPIRO · Administración</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#111827}.top{background:#101827;color:#fff;padding:16px 18px}.topin{max-width:1050px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:24px;font-weight:800}.brand small{display:block;font-size:12px;font-weight:400;opacity:.8}.wrap{max-width:1050px;margin:22px auto;padding:0 16px}.panel{background:#fff;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 2px 10px #0000000d}.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.hrow h1,.hrow h2{margin:0}.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:#16a34a;color:#fff}.dark{background:#111827;color:#fff}.light{background:#eef1f5;color:#111827}.danger{background:#dc2626;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:15px}.card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #e5e7eb}.pic{height:180px;background:#eef1f5;display:flex;align-items:center;justify-content:center;font-size:55px;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.body{padding:14px}.code{font-size:12px;color:#6b7280}.card h3{margin:5px 0;font-size:17px}.meta{font-size:13px;color:#4b5563}.price{font-size:20px;font-weight:800;margin:8px 0}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;font-size:15px}.full{grid-column:1/-1}.preview{width:100%;height:180px;border-radius:10px;background:#eef1f5;object-fit:cover;display:none}.notice{padding:11px 13px;border-radius:9px;background:#ecfdf5;color:#166534;margin-bottom:14px;display:none}.error{background:#fef2f2;color:#991b1b}.login{max-width:430px;margin:70px auto}.muted{color:#6b7280}.hidden{display:none!important}.toplinks{display:flex;gap:8px;align-items:center}.user{font-size:12px;opacity:.8}@media(max-width:650px){.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.grid{grid-template-columns:1fr 1fr}.pic{height:145px}.brand{font-size:20px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand">🛍️ KAMAPIRO<small>Administración de productos</small></div><div class="toplinks"><span id="userLabel" class="user"></span><button id="logout" class="btn light hidden" type="button">Salir</button></div></div></header>
<main class="wrap">
<section id="loginPanel" class="panel login">
<h2>🔐 Acceso de administración</h2><p class="muted">Entrá con el correo y contraseña de administración.</p>
<div class="field"><label>Correo</label><input id="email" type="email" autocomplete="username" placeholder="correo@ejemplo.com"></div><br>
<div class="field"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password"></div><br>
<button id="loginBtn" class="btn primary" style="width:100%" type="button">Entrar</button>
</section>
<section id="app" class="hidden">
<div id="notice" class="notice"></div>
<section class="panel"><div class="hrow"><div><h1>📦 Productos</h1><div class="muted">Agregá productos desde el celular, con foto, precio y existencia.</div></div><button id="newBtn" class="btn primary" type="button">＋ Nuevo producto</button></div></section>
<section id="formPanel" class="panel hidden">
<div class="hrow"><h2 id="formTitle">Nuevo producto</h2><button id="cancelBtn" class="btn light" type="button">Cancelar</button></div><br>
<div class="formgrid">
<div class="field"><label>Nombre del producto</label><input id="name" placeholder="Ej. Cartera casual para dama"></div>
<div class="field"><label>Código</label><input id="code" placeholder="Ej. CAR-001"></div>
<div class="field"><label>Categoría</label><select id="category"><option>Carteras y bolsos</option><option>Cosméticos</option><option>Hombre</option><option>Mujer</option><option>Calzado</option><option>Accesorios</option><option>Hogar y regalos</option></select></div>
<div class="field"><label>Precio (Lempiras)</label><input id="price" type="number" min="0" step="0.01" placeholder="750"></div>
<div class="field"><label>Existencia</label><input id="stock" type="number" min="0" step="1" placeholder="5"></div>
<div class="field"><label>Foto del producto</label><input id="image" type="file" accept="image/*" capture="environment"></div>
<div class="field full"><img id="preview" class="preview" alt="Vista previa"></div>
<div class="field full"><label><input id="active" type="checkbox" checked> Producto visible en la tienda</label></div>
</div><br><button id="saveBtn" class="btn primary" type="button">Guardar producto</button>
</section>
<section class="panel"><div class="hrow"><h2>Catálogo</h2><input id="filter" class="field" style="max-width:330px;padding:10px;border:1px solid #d1d5db;border-radius:9px" placeholder="🔎 Buscar producto..."></div></section>
<section id="products" class="grid"></section>
</section>
</main>
<script>
const cfg=window.KAMAPIRO_CONFIG||{};
let sb=null,currentId=null,products=[];
const $=id=>document.getElementById(id);
function configured(){return cfg.SUPABASE_URL&&cfg.SUPABASE_ANON_KEY&&!cfg.SUPABASE_URL.includes('PEGAR_AQUI')&&!cfg.SUPABASE_ANON_KEY.includes('PEGAR_AQUI')}
function showNotice(text,error=false){$('notice').textContent=text;$('notice').className='notice'+(error?' error':'');$('notice').style.display='block';setTimeout(()=>$('notice').style.display='none',3500)}
async function init(){if(!configured()){showNotice('Falta configurar Supabase en config.js.',true);return}sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);const {data:{session}}=await sb.auth.getSession();if(session)showApp(session);else showLogin();sb.auth.onAuthStateChange((_e,s)=>{if(s)showApp(s);else showLogin()})}
function showLogin(){$('loginPanel').classList.remove('hidden');$('app').classList.add('hidden');$('logout').classList.add('hidden')}
function showApp(session){$('loginPanel').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');$('userLabel').textContent=session.user.email;loadProducts()}
async function login(){if(!sb)return showNotice('Primero configuraremos Supabase.',true);const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)showNotice(error.message,true)}
async function loadProducts(){const {data,error}=await sb.from('products').select('*').order('created_at',{ascending:false});if(error)return showNotice(error.message,true);products=data||[];render()}
function money(n){return 'L.'+Number(n).toLocaleString('es-HN',{minimumFractionDigits:2})}
function render(){const q=$('filter').value.trim().toLowerCase();const list=products.filter(p=>`${p.name} ${p.code} ${p.category}`.toLowerCase().includes(q));$('products').innerHTML='';if(!list.length){$('products').innerHTML='<div class="panel muted">No hay productos.</div>';return}list.forEach(p=>{const card=document.createElement('article');card.className='card';card.innerHTML=`<div class="pic">${p.image_url?`<img src="${p.image_url}" alt="${escapeHtml(p.name)}">`:'📦'}</div><div class="body"><div class="code">${escapeHtml(p.code)}</div><h3>${escapeHtml(p.name)}</h3><div class="meta">${escapeHtml(p.category)} · ${p.active?'Visible':'Oculto'}</div><div class="price">${money(p.price)}</div><div class="meta">Existencia: ${p.stock}</div><div class="actions"><button class="btn light edit" type="button">Editar</button><button class="btn danger del" type="button">Eliminar</button></div></div>`;card.querySelector('.edit').onclick=()=>edit(p.id);card.querySelector('.del').onclick=()=>remove(p);$('products').appendChild(card)})}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}
function resetForm(){$('formPanel').classList.add('hidden');currentId=null;['name','code','price','stock'].forEach(id=>$(id).value='');$('category').value='Carteras y bolsos';$('active').checked=true;$('image').value='';$('preview').style.display='none';$('preview').src='';$('formTitle').textContent='Nuevo producto'}
function edit(id){const p=products.find(x=>x.id===id);if(!p)return;currentId=id;$('formTitle').textContent='Editar producto';$('name').value=p.name;$('code').value=p.code;$('category').value=p.category;$('price').value=p.price;$('stock').value=p.stock;$('active').checked=p.active;$('image').value='';if(p.image_url){$('preview').src=p.image_url;$('preview').style.display='block'}$('formPanel').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
async function uploadImage(file){const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');const path=`${sb.auth.getUser?crypto.randomUUID():Date.now()}.${ext||'jpg'}`;const {error}=await sb.storage.from('products').upload(path,file,{upsert:false,contentType:file.type});if(error)throw error;return sb.storage.from('products').getPublicUrl(path).data.publicUrl}
async function save(){const name=$('name').value.trim(),code=$('code').value.trim(),category=$('category').value,price=Number($('price').value),stock=Number($('stock').value),active=$('active').checked;if(!name||!code||!Number.isFinite(price)||!Number.isFinite(stock))return showNotice('Completá nombre, código, precio y existencia.',true);$('saveBtn').disabled=true;$('saveBtn').textContent='Guardando...';try{let image_url=currentId?(products.find(p=>p.id===currentId)?.image_url||null):null;const file=$('image').files[0];if(file)image_url=await uploadImage(file);const payload={name,code,category,price,stock,active,image_url,updated_at:new Date().toISOString()};let result=currentId?await sb.from('products').update(payload).eq('id',currentId):await sb.from('products').insert(payload);if(result.error)throw result.error;showNotice('✓ Producto guardado');resetForm();await loadProducts()}catch(e){showNotice(e.message||'No se pudo guardar.',true)}finally{$('saveBtn').disabled=false;$('saveBtn').textContent='Guardar producto'}}
async function remove(p){if(!confirm(`¿Eliminar "${p.name}"?`))return;const {error}=await sb.from('products').delete().eq('id',p.id);if(error)return showNotice(error.message,true);showNotice('Producto eliminado');loadProducts()}
$('loginBtn').onclick=login;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('logout').onclick=()=>sb.auth.signOut();$('newBtn').onclick=()=>{$('formPanel').classList.remove('hidden');resetFieldsForNew()};$('cancelBtn').onclick=resetForm;$('saveBtn').onclick=save;$('filter').addEventListener('input',render);$('image').addEventListener('change',e=>{const f=e.target.files[0];if(f){$('preview').src=URL.createObjectURL(f);$('preview').style.display='block'}});
function resetFieldsForNew(){currentId=null;$('formTitle').textContent='Nuevo producto';['name','code','price','stock'].forEach(id=>$(id).value='');$('category').value='Carteras y bolsos';$('active').checked=true;$('image').value='';$('preview').style.display='none';$('preview').src='';window.scrollTo({top:0,behavior:'smooth'})}
init();
</script>
</body>
</html>
