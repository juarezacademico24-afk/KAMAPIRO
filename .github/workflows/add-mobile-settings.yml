name: Add mobile settings button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-mobile-settings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Configuracion to mobile admin navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "<button onclick=\"adminGo('inventory')\">📊<br>Inventario</button></div>"
          new = "<button onclick=\"adminGo('inventory')\">📊<br>Inventario</button><button onclick=\"adminGo('settings')\">⚙️<br>Configuración</button></div>"
          if old not in s:
              raise SystemExit('No se encontró el menú móvil esperado')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit and finish
        run: |
          git config user.name "KAMAPIRO Bot"
          git config user.email "actions@github.com"
          git add index.html
          git rm .github/workflows/add-mobile-settings.yml
          git commit -m "Agregar Configuracion al menu movil"
          git push
