<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAMAPIRO · Proveedores</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#222}header{background:#111827;color:#fff;text-align:center;padding:18px}header h1{margin:0}header p{margin:5px 0}.container{max-width:980px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px #0001}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.field{margin:12px 0}.field label{display:block;font-weight:bold;margin-bottom:5px}.field input,.field textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;font-size:16px}.field textarea{min-height:70px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.btn{border:0;border-radius:9px;padding:10px 13px;margin:3px;cursor:pointer}.success{background:#16a34a;color:#fff}.danger{background:#dc2626;color:#fff}.warning{background:#f59e0b;color:#fff}.secondary{background:#e5e7eb}.row{display:flex;gap:12px;align-items:center;border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:10px 0}.grow{flex:1}.muted{color:#666;font-size:13px}.metric{border:1px solid #e5e7eb;border-radius:10px;padding:14px}.metric small{display:block;color:#666}.metric strong{font-size:22px}.calc{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}.row{align-items:flex-start}.actions{display:flex;flex-wrap:wrap}} </style></head><body><header><h1>🛍️ KAMAPIRO</h1><p>Proveedores</p></header><div class="container"><div class="top"><h2>🏢 Proveedores</h2><div><button class="btn secondary" onclick="location.href='compras.html'">← Compras</button><button class="btn secondary" onclick="location.href='index.html'">Inicio</button></div></div><div class="card"><h3 id="titulo">➕ Registrar proveedor</h3><div class="grid"><div class="field"><label>Nombre / Empresa</label><input id="nombre" placeholder="Ej. Repuestos del Norte"></div><div class="field"><label>RTN / Identificación</label><input id="rtn" placeholder="RTN o identificación"></div><div class="field"><label>Teléfono / WhatsApp</label><input id="telefono" placeholder="50499999999"></div><div class="field"><label>Contacto</label><input id="contacto" placeholder="Nombre del vendedor"></div></div><div class="field"><label>Dirección / Notas</label><textarea id="notas"></textarea></div><button class="btn success" id="guardar" onclick="guardarProveedor()">💾 Guardar proveedor</button><button class="btn secondary" id="cancelar" onclick="cancelar()" style="display:none">Cancelar</button></div><div class="card"><h3>📊 Resumen</h3><div class="grid"><div class="metric"><small>Proveedores registrados</small><strong id="total">0</strong></div><div class="metric"><small>Proveedores con compras</small><strong id="conCompras">0</strong></div></div></div><div class="card"><h3>📋 Mis proveedores</h3><input id="buscar" oninput="render()" placeholder="🔎 Buscar proveedor..." style="width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;font-size:16px"><div id="lista"></div></div></div><script>let A=JSON.parse(localStorage.getItem('kamapiro_proveedores')||'[]'),Q=JSON.parse(localStorage.getItem('kamapiro_compras')||'[]'),editId=null;const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));function guardarProveedor(){let n=nombre.value.trim();if(!n)return alert('Ingresá el nombre del proveedor.');let o={id:editId||String(Date.now()),nombre:n,rtn:rtn.value.trim(),telefono:telefono.value.trim(),contacto:contacto.value.trim(),notas:notas.value.trim()};if(editId){let i=A.findIndex(x=>x.id===editId);if(i>=0)A[i]=o}else A.unshift(o);localStorage.setItem('kamapiro_proveedores',JSON.stringify(A));alert('✅ Proveedor guardado.');cancelar();render()}function editar(id){let p=A.find(x=>x.id===id);if(!p)return;editId=id;nombre.value=p.nombre;rtn.value=p.rtn||'';telefono.value=p.telefono||'';contacto.value=p.contacto||'';notas.value=p.notas||'';titulo.textContent='✏️ Editar proveedor';guardar.textContent='💾 Actualizar proveedor';cancelar.style.display='inline-block';scrollTo({top:0,behavior:'smooth'})}function eliminar(id){if(!confirm('¿Eliminar este proveedor?'))return;A=A.filter(x=>x.id!==id);localStorage.setItem('kamapiro_proveedores',JSON.stringify(A));render()}function cancelar(){editId=null;nombre.value='';rtn.value='';telefono.value='';contacto.value='';notas.value='';titulo.textContent='➕ Registrar proveedor';guardar.textContent='💾 Guardar proveedor';cancelar.style.display='none'}function render(){let q=buscar.value.toLowerCase();let lista=A.filter(p=>[p.nombre,p.rtn,p.telefono,p.contacto].join(' ').toLowerCase().includes(q));total.textContent=A.length;let usados=new Set(Q.map(x=>String(x.proveedor||'').toLowerCase()));conCompras.textContent=A.filter(p=>usados.has(p.nombre.toLowerCase())).length;document.getElementById('lista').innerHTML=lista.length?lista.map(p=>{let compras=Q.filter(x=>String(x.proveedor||'').toLowerCase()===p.nombre.toLowerCase());let totalC=compras.reduce((s,x)=>s+Number(x.total||0),0);return `<div class="row"><div class="grow"><b>🏢 ${esc(p.nombre)}</b><div class="muted">${p.rtn?'RTN: '+esc(p.rtn)+' · ':''}${p.telefono?'Tel.: '+esc(p.telefono):''}</div><div>${p.contacto?'Contacto: '+esc(p.contacto):'Sin contacto registrado'}</div><div>Compras: <b>${compras.length}</b> · Acumulado: <b>L.${totalC.toLocaleString('es-HN',{minimumFractionDigits:2})}</b></div>${p.notas?`<div class="muted">${esc(p.notas)}</div>`:''}</div><div class="actions"><button class="btn warning" onclick="editar('${p.id}')">✏️ Editar</button><button class="btn danger" onclick="eliminar('${p.id}')">Eliminar</button></div></div>`}).join(''):'<p class="muted">No hay proveedores registrados.</p>'}render();</script></body></html>
