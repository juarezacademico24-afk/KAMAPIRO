<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAMAPIRO · Tienda</title><script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#111827}.top{background:#111827;color:#fff;padding:18px;text-align:center;position:sticky;top:0;z-index:5}.wrap{max-width:1100px;margin:auto;padding:18px}.hero{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px}.search{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:15px}.card{background:#fff;border-radius:15px;padding:14px;box-shadow:0 2px 10px #0001}.pic{height:190px;border-radius:10px;background:#eef1f5;display:flex;align-items:center;justify-content:center;font-size:48px;overflow:hidden;margin-bottom:10px}.pic img{width:100%;height:100%;object-fit:cover}.price{font-size:21px;font-weight:800;margin:10px 0}.muted{color:#6b7280;font-size:13px}.empty{text-align:center;padding:40px;color:#6b7280}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}.pic{height:145px}}</style></head><body><header class="top"><h1>🛍️ KAMAPIRO</h1><div>Tu tienda en línea</div></header><main class="wrap"><section class="hero"><h2>Encontrá lo que necesitás</h2><input id="search" class="search" placeholder="🔎 Buscar producto..."></section><section id="grid" class="grid"></section></main><script>firebase.initializeApp(window.KAMAPIRO_FIREBASE_CONFIG);const db=firebase.firestore();let products=[];const $=id=>document.getElementById(id);function money(n){return 'L.'+(Number(n)||0).toLocaleString('es-HN',{minimumFractionDigits:2})}function esc(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}function render(){const q=$('search').value.toLowerCase();const a=products.filter(p=>(p.nombre+' '+p.codigo+' '+p.categoria).toLowerCase().includes(q));$('grid').innerHTML=a.length?a.map(p=>`<article class="card"><div class="pic">${p.imagen?`<img src="${p.imagen}" alt="${esc(p.nombre)}">`:'📦'}</div><div class="muted">${esc(p.codigo||'')}</div><h3>${esc(p.nombre)}</h3><div class="muted">${esc(p.descripcion||'')}</div><div class="price">${money(p.precio)}</div>${Number(p.existencia)>0?`<div class="muted">✓ Disponible</div>`:'<div class="muted">Agotado</div>'}</article>`).join(''):'<div class="empty">Todavía no hay productos publicados.</div>'}$('search').oninput=render;db.collection('productos').where('activo','==',true).onSnapshot(s=>{products=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>{$('grid').innerHTML='<div class="empty">La tienda está temporalmente en mantenimiento.</div>';console.error(e)});</script></body></html>
