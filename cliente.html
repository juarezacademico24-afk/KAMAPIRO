<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAMAPIRO · Tienda</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#111827}.top{background:#101827;color:#fff;padding:18px 22px;position:sticky;top:0;z-index:10}.topin{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-size:25px;font-weight:800}.brand small{display:block;font-size:12px;font-weight:400;opacity:.8}.cart{background:#16a34a;border:0;color:#fff;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer}.wrap{max-width:1100px;margin:25px auto;padding:0 18px}.hero{background:#fff;border-radius:18px;padding:25px;margin-bottom:20px;box-shadow:0 2px 10px #0000000d}.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:0;color:#6b7280}.search{width:100%;padding:14px;border:1px solid #d1d5db;border-radius:11px;margin-top:18px;font-size:16px}.cats{display:flex;gap:8px;overflow:auto;margin:18px 0}.cat{border:1px solid #d1d5db;background:#fff;padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}.cat.active{background:#111827;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.card{background:#fff;border-radius:15px;padding:16px;box-shadow:0 2px 10px #0000000b}.pic{height:190px;border-radius:11px;background:#eef1f5;display:flex;align-items:center;justify-content:center;font-size:48px;margin-bottom:12px;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.card h3{margin:0 0 5px;font-size:17px}.code{font-size:12px;color:#6b7280}.price{font-size:21px;font-weight:800;margin:12px 0}.stock{font-size:12px;color:#15803d;margin-bottom:10px}.add{width:100%;padding:11px;border:0;border-radius:9px;background:#16a34a;color:#fff;font-weight:700;cursor:pointer}.add:active{transform:scale(.98)}.empty{text-align:center;padding:40px;color:#6b7280}.notice{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:13px 17px;border-radius:10px;display:none;z-index:30;box-shadow:0 5px 20px #0004}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;padding:30px}.box{background:#fff;max-width:560px;margin:auto;border-radius:16px;padding:22px;max-height:90vh;overflow:auto}.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eee;padding:12px 0}.qty button{border:1px solid #ccc;background:#fff;border-radius:6px;padding:4px 9px;cursor:pointer}.checkout{margin-top:18px;width:100%;padding:13px;border:0;border-radius:10px;background:#16a34a;color:#fff;font-weight:800;cursor:pointer}.close{float:right;border:0;background:#eee;border-radius:8px;padding:7px 10px;cursor:pointer}@media(max-width:600px){.hero h1{font-size:24px}.grid{grid-template-columns:1fr 1fr}.pic{height:145px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand">🛍️ KAMAPIRO<small>Compra fácil · productos para todos</small></div><button class="cart" id="cartButton" type="button">🛒 Carrito (<span id="count">0</span>)</button></div></header>
<main class="wrap">
<section class="hero"><h1>Encontrá lo que necesitás</h1><p>Buscá por nombre, código o categoría y agregá tus productos al carrito.</p><input id="search" class="search" placeholder="🔎 Buscar producto..." autocomplete="off"></section>
<div id="cats" class="cats"></div><section id="grid" class="grid"></section>
</main>
<div id="notice" class="notice"></div>
<div id="modal" class="modal"><div class="box"><button class="close" id="closeButton" type="button">✕</button><h2>🛒 Tu carrito</h2><div id="cartItems"></div><h3 id="total"></h3><button class="checkout" id="checkoutButton" type="button">📲 Solicitar pedido por WhatsApp</button></div></div>
<script>
const cfg=window.KAMAPIRO_CONFIG||{};let db=null;
const demoProducts=[
{id:1,name:'Cartera casual para dama',code:'CAR-001',category:'Carteras y bolsos',price:750,stock:5,image_url:null,icon:'👜'},
{id:2,name:'Perfume para dama',code:'COS-002',category:'Cosméticos',price:650,stock:8,image_url:null,icon:'🌸'},
{id:3,name:'Set de maquillaje',code:'COS-003',category:'Cosméticos',price:480,stock:6,image_url:null,icon:'💄'},
{id:4,name:'Camiseta para caballero',code:'HOM-004',category:'Hombre',price:550,stock:10,image_url:null,icon:'👕'},
{id:5,name:'Blusa para dama',code:'MUJ-005',category:'Mujer',price:620,stock:7,image_url:null,icon:'👚'},
{id:6,name:'Tenis casuales',code:'CAL-006',category:'Calzado',price:1250,stock:4,image_url:null,icon:'👟'},
{id:7,name:'Reloj de caballero',code:'ACC-007',category:'Accesorios',price:900,stock:5,image_url:null,icon:'⌚'},
{id:8,name:'Regalo decorativo',code:'REG-008',category:'Hogar y regalos',price:350,stock:9,image_url:null,icon:'🎁'}
];
let products=[],cart=[],active='Todos';const $=id=>document.getElementById(id);
function configured(){return cfg.SUPABASE_URL&&cfg.SUPABASE_ANON_KEY&&!cfg.SUPABASE_URL.includes('PEGAR_AQUI')&&!cfg.SUPABASE_ANON_KEY.includes('PEGAR_AQUI')}
function money(n){return 'L.'+Number(n).toLocaleString('es-HN',{minimumFractionDigits:2})}
async function loadProducts(){if(!configured()){products=demoProducts;render();return}const{data,error}=await db.from('productos').select('*').eq('activo',true).order('created_at',{ascending:false});if(error||!data){products=demoProducts;render();return}products=data;render()}
function renderCats(){const cats=['Todos',...new Set(products.map(p=>p.category||p.cat))];$('cats').innerHTML='';cats.forEach(c=>{const b=document.createElement('button');b.className='cat'+(c===active?' active':'');b.type='button';b.textContent=c;b.onclick=()=>{active=c;render()};$('cats').appendChild(b)})}
function render(){renderCats();const q=$('search').value.trim().toLowerCase();const list=products.filter(p=>(active==='Todos'||(p.category||p.cat)===active)&&(`${p.name} ${p.code} ${p.category||p.cat}`).toLowerCase().includes(q));$('grid').innerHTML='';if(!list.length){$('grid').innerHTML='<div class="empty">No encontramos productos con esa búsqueda.</div>';return}list.forEach(p=>{const card=document.createElement('article');card.className='card';const image=p.image_url?`<img src="${p.image_url}" alt="${escapeHtml(p.name)}" loading="lazy">`:(p.icon||'📦');card.innerHTML=`<div class="pic">${image}</div><div class="code">${escapeHtml(p.code)}</div><h3>${escapeHtml(p.name)}</h3><div class="price">${money(p.price)}</div><div class="stock">✓ ${p.stock} disponibles</div><button class="add" type="button">Agregar al carrito</button>`;card.querySelector('.add').onclick=()=>add(p.id);$('grid').appendChild(card)})}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}
function add(id){const p=products.find(x=>x.id===id);if(!p)return;const x=cart.find(x=>x.id===id);if(x){if(x.qty<p.stock)x.qty++;else return showNotice('No hay más unidades disponibles.')}else cart.push({...p,qty:1});updateCount();showNotice('✓ '+p.name+' agregado al carrito')}
function updateCount(){$('count').textContent=cart.reduce((a,x)=>a+x.qty,0)}
function openCart(){$('modal').style.display='block';renderCart()}
function renderCart(){const el=$('cartItems');if(!cart.length){el.innerHTML='<div class="empty">Tu carrito está vacío.</div>';$('total').textContent='';$('checkoutButton').style.display='none';return}$('checkoutButton').style.display='block';el.innerHTML=cart.map(x=>`<div class="row"><div><b>${escapeHtml(x.name)}</b><br>${money(x.price)} × ${x.qty}</div><div class="qty"><button type="button" data-id="${x.id}" data-change="-1">−</button> ${x.qty} <button type="button" data-id="${x.id}" data-change="1">+</button></div></div>`).join('');el.querySelectorAll('button').forEach(b=>b.onclick=()=>change(Number(b.dataset.id),Number(b.dataset.change)));$('total').textContent='Total: '+money(cart.reduce((a,x)=>a+x.price*x.qty,0))}
function closeCart(){$('modal').style.display='none'}
function change(id,n){const x=cart.find(x=>x.id===id);if(!x)return;x.qty+=n;if(x.qty<=0)cart=cart.filter(x=>x.id!==id);updateCount();renderCart()}
function showNotice(text){$('notice').textContent=text;$('notice').style.display='block';clearTimeout(window.noticeTimer);window.noticeTimer=setTimeout(()=>{$('notice').style.display='none'},1800)}
function sendOrder(){if(!cart.length)return;const lines=cart.map(x=>`• ${x.name} x${x.qty} = ${money(x.price*x.qty)}`);const total=cart.reduce((a,x)=>a+x.price*x.qty,0);const msg='Hola, quiero solicitar este pedido en KAMAPIRO:\n\n'+lines.join('\n')+'\n\nTotal estimado: '+money(total);const encoded=encodeURIComponent(msg);const appUrl='whatsapp://send?phone=50497861736&text='+encoded;const webUrl='https://web.whatsapp.com/send?phone=50497861736&text='+encoded;window.location.href=appUrl;setTimeout(()=>{if(!document.hidden)window.open(webUrl,'_blank')},1800)}
$('search').oninput=render;$('cartButton').onclick=openCart;$('closeButton').onclick=closeCart;$('checkoutButton').onclick=sendOrder;$('modal').onclick=e=>{if(e.target===$('modal'))closeCart()};loadProducts();updateCount();
</script>
</body>
</html>
